# ============================================================================
# DR 压测配置（docs/压测方案.md 第十节）：DR + pipeline
#   client 192.168.154.133 -> VIP 192.168.154.130 -> nginx 192.168.154.140:80
#   RS 直接回包给 client，回程不经过 LB
# RS 上先执行：sudo tests/perf/dr_rs.sh up（lo 绑 VIP、关闭 VIP 的 ARP 响应）
# 启动：sudo ./build/l4lb -l 1-3 -- --lb-config config/bench_dr.conf
# 与 config/bench.conf 的区别：mode = dr；只有一个 RS（DR 不改端口，一台 nginx
# 只能当一个 RS）；不需要 LIP
# ============================================================================

[global]
# 转发模式: nat (FULLNAT) 或 dr (直接路由)
mode = dr
# 日志级别: debug, info, warn, error（启动参数 --log 可覆盖）
log_level = info
# 数据面模式（docs/pipeline改造.md）：
#   rtc      每个 lcore 收包 + 处理，适合有 RSS 的网卡
#   pipeline main lcore 收包分发，其余 lcore 处理；VMware vmxnet3 没有 RSS 时用
#            -l 1-3 = lcore 1 receiver，lcore 2/3 两个 worker
dataplane = pipeline
# 日志目录（自动创建），留空则只输出到终端；启动参数 --log-dir 可覆盖
log_dir = /data/logs/l4
# 单个日志文件上限（MB），超过后轮转为 l4lb.log.1 ... l4lb.log.N
log_max_size_mb = 100
log_max_files = 5
# 写文件的同时输出到终端：压测时关闭，避免终端输出拖慢 master 线程
log_stderr = off
# 周期统计间隔（秒），压测时缩短以便多拿采样点：累计计数 + 本周期速率（pps / 新建连接）+ 各线程忙碌率 + 网卡丢包
stats_interval = 5
# 所有 worker 合计的最大会话数
max_sessions = 1048576
# 各状态超时（秒）
tcp_syn_timeout = 10
tcp_established_timeout = 900
tcp_fin_timeout = 10
tcp_timewait_timeout = 10
tcp_close_timeout = 5
udp_timeout = 60
# 在客户端第三个 ACK 中插入 TOA（TCP 选项 254），RS 加载 toa.ko 后
# getpeername() 能拿到真实客户端地址；RS 没有 toa.ko 时会忽略该选项
toa = off
# 去掉 SYN 中的 TCP timestamp（多个客户端共用 LIP 时避免 RS 的 PAWS 丢包）
strip_tcp_timestamp = on
# 多核分发: auto（网卡支持 RSS 时用硬件 RSS）或 sw（调试用）
steering = auto

[network]
# 本机 MAC；留空时使用网卡 MAC
# vip_mac = 00:0c:29:3e:38:9c
netmask = 255.255.255.0
gateway = 192.168.154.2
# DR 不做 SNAT，不需要 LIP。健康检查源地址：RS 回 SYN-ACK 给它，必须是本网段
# 内未被占用、且不是 VIP 的地址（RS 的 lo 上有 VIP，发给 VIP 的回包会被 RS 自己收掉）
hc_src = 192.168.154.131

[healthcheck]
enabled = true
# 探测间隔（秒）
interval = 5
# 超时（毫秒）
timeout = 3000
failure_threshold = 3
success_threshold = 2

[control]
# 控制命令：scripts/l4lbctl.py -s /run/l4lb.sock stats
socket = /run/l4lb.sock

# ============================================================================
# 服务：[service.<名字>]，serverN = ip:port[:weight[:mac]]
# mac 留空时通过 ARP 解析
# DR：RS 端口必须与 VIP 端口相同（只改 MAC，不改端口）
# ============================================================================
[service.http]
vip = 192.168.154.130
port = 80
proto = tcp
# wrr（加权轮询）或 maglev（一致性哈希）
scheduler = wrr
server1 = 192.168.154.140:80:1
