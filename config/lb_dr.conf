# ============================================================================
# L4 负载均衡器配置文件（DR 模式）
#
# DR 模式只改写目的 MAC，RS 直接回包给客户端，RS 需要：
#   ip addr add <VIP>/32 dev lo
#   sysctl -w net.ipv4.conf.all.arp_ignore=1 net.ipv4.conf.all.arp_announce=2
#   sysctl -w net.ipv4.conf.lo.arp_ignore=1  net.ipv4.conf.lo.arp_announce=2
# RS 端口必须与 VIP 端口相同（DR 不改端口）
# ============================================================================

[global]
mode = dr
log_level = info
# 数据面模式（docs/pipeline改造.md）：
#   rtc      每个 lcore 收包 + 处理，适合有 RSS 的网卡
#   pipeline main lcore 收包分发，其余 lcore 处理；VMware vmxnet3 没有 RSS 时用
#            -l 1-3 = lcore 1 receiver，lcore 2/3 两个 worker
dataplane = pipeline
# 日志目录（自动创建），留空则只输出到终端；启动参数 --log-dir 可覆盖
log_dir = /data/logs/l4
# 单个日志文件上限（MB），超过后轮转为 l4lb.log.1 ... l4lb.log.N
log_max_size_mb = 100
log_max_files = 5
# 写文件的同时输出到终端（后台运行时可关闭）
log_stderr = on
# 周期统计间隔（秒）：累计计数 + 本周期速率（pps / 新建连接）+ 各线程忙碌率 + 网卡丢包
stats_interval = 10
max_sessions = 1048576
tcp_established_timeout = 900

[network]
netmask = 255.255.255.0
gateway = 192.168.154.2
# 健康检查源地址：DR 模式下不能用 VIP（RS 的 lo 上也有 VIP），需要单独一个地址
hc_src = 192.168.154.131

[healthcheck]
enabled = true
interval = 5
timeout = 3000
failure_threshold = 3
success_threshold = 2

[control]
socket = /run/l4lb.sock

[service.http]
vip = 192.168.154.130
port = 80
proto = tcp
scheduler = maglev
# RS 上需要 lo 绑 VIP 并关闭 VIP 的 ARP 响应：tests/perf/dr_rs.sh up
server1 = 192.168.154.140:80:1
