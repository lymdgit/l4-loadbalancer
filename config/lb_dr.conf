# ============================================================================
# L4 负载均衡器配置文件（DR 模式）
#
# DR 模式只改写目的 MAC，RS 直接回包给客户端，RS 需要：
#   ip addr add <VIP>/32 dev lo
#   sysctl -w net.ipv4.conf.all.arp_ignore=1 net.ipv4.conf.all.arp_announce=2
#   sysctl -w net.ipv4.conf.lo.arp_ignore=1  net.ipv4.conf.lo.arp_announce=2
# RS 端口必须与 VIP 端口相同（DR 不改端口）
# ============================================================================

[global]
mode = dr
log_level = info
max_sessions = 1048576
tcp_established_timeout = 900

[network]
netmask = 255.255.255.0
gateway = 192.168.154.2
# 健康检查源地址：DR 模式下不能用 VIP（RS 的 lo 上也有 VIP），需要单独一个地址
hc_src = 192.168.154.131

[healthcheck]
enabled = true
interval = 5
timeout = 3000
failure_threshold = 3
success_threshold = 2

[control]
socket = /run/l4lb.sock

[service.http]
vip = 192.168.154.130
port = 80
proto = tcp
scheduler = maglev
server1 = 192.168.154.133:80:50:00:0c:29:bd:b3:a4
server2 = 192.168.154.132:80:50:00:0c:29:c1:c8:a7
