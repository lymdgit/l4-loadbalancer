# ============================================================================
# L4 负载均衡器配置文件（FULLNAT 模式）
# ============================================================================

[global]
# 转发模式: nat (FULLNAT) 或 dr (直接路由)
mode = nat
# 日志级别: debug, info, warn, error（启动参数 --log 可覆盖）
log_level = info
# 所有 worker 合计的最大会话数
max_sessions = 1048576
# 各状态超时（秒）
tcp_syn_timeout = 10
tcp_established_timeout = 900
tcp_fin_timeout = 10
tcp_timewait_timeout = 10
tcp_close_timeout = 5
udp_timeout = 60
# 在客户端第三个 ACK 中插入 TOA（TCP 选项 254），RS 加载 toa.ko 后
# getpeername() 能拿到真实客户端地址；RS 没有 toa.ko 时会忽略该选项
toa = off
# 去掉 SYN 中的 TCP timestamp（多个客户端共用 LIP 时避免 RS 的 PAWS 丢包）
strip_tcp_timestamp = on
# 多核分发: auto（网卡支持 RSS 时用硬件 RSS）或 sw（调试用）
steering = auto

[network]
# 本机 MAC；留空时使用网卡 MAC
# vip_mac = 00:0c:29:3e:38:9c
netmask = 255.255.255.0
gateway = 192.168.154.2
# FULLNAT 的 SNAT 源地址（LIP），必须是本网段内未被占用的地址；
# 留空时使用 VIP（此时 VIP 上的服务端口不能在 10000-61999 之间）
local_ips = 192.168.154.131
# 健康检查源地址，默认使用第一个 LIP
# hc_src = 192.168.154.131

[healthcheck]
enabled = true
# 探测间隔（秒）
interval = 5
# 超时（毫秒）
timeout = 3000
failure_threshold = 3
success_threshold = 2

[control]
# 控制命令：scripts/l4lbctl.py -s /run/l4lb.sock stats
socket = /run/l4lb.sock

# ============================================================================
# 服务：[service.<名字>]，serverN = ip:port[:weight[:mac]]
# mac 留空时通过 ARP 解析
# ============================================================================
[service.http]
vip = 192.168.154.130
port = 80
proto = tcp
# wrr（加权轮询）或 maglev（一致性哈希）
scheduler = wrr
server1 = 192.168.154.133:80:50:00:0c:29:bd:b3:a4
server2 = 192.168.154.132:80:50:00:0c:29:c1:c8:a7

[service.http-alt]
vip = 192.168.154.130
port = 8080
proto = tcp
scheduler = wrr
server1 = 192.168.154.133:80:50:00:0c:29:bd:b3:a4
server2 = 192.168.154.132:80:50:00:0c:29:c1:c8:a7
