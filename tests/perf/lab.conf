# ============================================================================
# 单机实验环境（tests/perf/lab.sh 使用）
#
#   客户端 (本机 ens33, 192.168.154.142)
#      |  GET http://192.168.154.130/
#      v
#   LB  (本机 ens160 / DPDK, VIP .130, LIP .131 .134 .135 .136)
#      |  FULLNAT: LIP:nat_port -> 192.168.154.142:8081/8082
#      v
#   RS a/b (本机 ens33 内核协议栈, rs_server 监听 8081 / 8082)
#
# 客户端、LB、RS 在同一台虚拟机上，相互抢 CPU，测得的数字只用于观察功能和
# 相对变化，不代表 LB 的真实性能。
# ============================================================================

[global]
mode = nat
log_level = info
# 数据面模式（docs/pipeline改造.md）：
#   rtc      每个 lcore 收包 + 处理，适合有 RSS 的网卡
#   pipeline main lcore 收包分发，其余 lcore 处理；VMware vmxnet3 没有 RSS 时用
#            -l 1-3 = lcore 1 receiver，lcore 2/3 两个 worker
dataplane = pipeline
# 日志目录（自动创建），留空则只输出到终端；启动参数 --log-dir 可覆盖
log_dir = /data/logs/l4
# 单个日志文件上限（MB），超过后轮转为 l4lb.log.1 ... l4lb.log.N
log_max_size_mb = 100
log_max_files = 5
# 写文件的同时输出到终端（后台运行时可关闭）
log_stderr = on
# 周期统计间隔（秒）：累计计数 + 本周期速率（pps / 新建连接）+ 各线程忙碌率 + 网卡丢包
stats_interval = 10
max_sessions = 1048576
tcp_established_timeout = 300
toa = off
strip_tcp_timestamp = on

[network]
netmask = 255.255.255.0
gateway = 192.168.154.2
# 每个 LIP 约提供 5 万个 SNAT 端口；RS 侧 TIME_WAIT 为 60 秒，
# 短连接压测时每个 LIP 可持续约 800 CPS（多个 LIP 叠加）
local_ips = 192.168.154.131, 192.168.154.134, 192.168.154.135, 192.168.154.136
hc_src = 192.168.154.131

[healthcheck]
enabled = true
interval = 2
timeout = 1000
failure_threshold = 2
success_threshold = 2

[control]
socket = /run/l4lb.sock

[service.web]
vip = 192.168.154.130
port = 80
proto = tcp
scheduler = wrr
# 不写 MAC：由 LB 通过 ARP 解析
server1 = 192.168.154.142:8081:1
server2 = 192.168.154.142:8082:1
